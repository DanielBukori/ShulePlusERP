{% extends 'shule_core/base_tailwind.html' %}
{% block title %}Hariri Programu{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-5">
    <div>
      <p class="eyebrow mb-1">Tovuti ya Shule</p>
      <h1 class="font-serif text-xl md:text-2xl font-bold" style="color: var(--brand)">Hariri: {{ program.name }}</h1>
    </div>
    <a href="{% url 'branding:manage_programs' %}" class="sp-btn sp-btn-ghost">&larr; Rudi</a>
  </div>
  <div class="sp-card p-5 md:p-8 sp-reveal">
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-xs uppercase mb-1 font-semibold" style="color: var(--ink-3)">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<p class="text-xs mt-1" style="color: var(--bad)">{{ e }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="sp-btn sp-btn-primary">Hifadhi</button>
    </form>
  </div>
</div>
{% endblock %}
