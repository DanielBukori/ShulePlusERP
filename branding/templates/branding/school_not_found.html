{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shule Haijapatikana</title>
<link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center" style="background: var(--surface)">
  <div class="sp-card px-8 py-12 mx-4 max-w-md w-full text-center sp-reveal">
    <div class="h-14 w-14 rounded-2xl grid place-items-center mx-auto mb-5"
         style="background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn)">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/>
      </svg>
    </div>
    <h1 class="font-serif text-2xl font-bold mb-2" style="color: var(--brand)">Shule Haijapatikana</h1>
    <p class="text-sm mb-7" style="color: var(--ink-2)">Hakikisha subdomain/link uliyotumia ni sahihi.</p>
    <a href="/" class="sp-btn sp-btn-primary">Rudi Kwenye Mfumo</a>
  </div>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
