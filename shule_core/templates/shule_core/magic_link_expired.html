{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Imeisha Muda</title>
<link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10" style="background: var(--surface)">

  <div class="sp-card w-full max-w-sm p-8 text-center relative">
    <div class="absolute inset-2 rounded-xl pointer-events-none" style="border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent)"></div>

    <div class="relative">
      <div class="h-14 w-14 rounded-full flex items-center justify-center mx-auto mb-4"
           style="background: rgba(220,38,38,.12); color: var(--bad)">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p class="eyebrow mb-2">Link ya Kuingia</p>
      <h2 class="font-serif text-xl font-bold mb-2" style="color: var(--brand)">Link Imeisha Muda</h2>
      <p class="text-sm mb-6" style="color: var(--ink-2)">Link hii ya kuingia si sahihi tena, au imepitwa na dakika 10. Jaribu kuingia tena.</p>
      <a href="{% url 'accounts:login' %}" class="sp-btn sp-btn-gold w-full">Rudi kwenye Login</a>
    </div>
  </div>

</body>
</html>
