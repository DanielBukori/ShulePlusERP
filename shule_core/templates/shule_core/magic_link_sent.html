{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angalia Barua Pepe Yako</title>
<link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-10" style="background: var(--surface)">

  <div class="sp-card w-full max-w-sm p-8 text-center relative">
    <div class="absolute inset-2 rounded-xl pointer-events-none" style="border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent)"></div>

    <div class="relative">
      <div class="h-14 w-14 rounded-full flex items-center justify-center mx-auto mb-4"
           style="background: rgba(20,107,58,.12); color: var(--ok)">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <p class="eyebrow mb-2">Barua Pepe</p>
      <h2 class="font-serif text-xl font-bold mb-2" style="color: var(--brand)">Angalia Barua Pepe Yako</h2>
      <p class="text-sm mb-1" style="color: var(--ink-2)">Tumetuma kiungo cha kuingia kwenye:</p>
      <p class="text-sm font-semibold mb-4" style="color: var(--brand)">{{ email }}</p>
      <p class="text-xs" style="color: var(--ink-3)">Bofya kiungo hicho kuingia. Kinaisha muda baada ya dakika 10.</p>
      <a href="{% url 'accounts:login' %}" class="sp-btn sp-btn-ghost w-full mt-6">&larr; Rudi kwenye ukurasa wa kuingia</a>
    </div>
  </div>

</body>
</html>
