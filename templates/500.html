{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitilafu ya Mfumo</title>
<link href="{% static 'css/tailwind.css' %}" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center" style="background: var(--surface)">
  <div class="sp-card px-8 py-12 mx-4 max-w-md w-full text-center sp-reveal">
    <div class="h-14 w-14 rounded-2xl grid place-items-center mx-auto mb-5"
         style="background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand)">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 3h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
      </svg>
    </div>
    <p class="text-xs font-semibold mb-2" style="color: var(--ink-3)">KOSA 500</p>
    <h1 class="font-serif text-2xl font-bold mb-2" style="color: var(--brand)">Mfumo Umekwama Kidogo</h1>
    <p class="text-sm mb-7" style="color: var(--ink-2)">Tunaomba radhi. Jaribu tena baada ya muda mfupi; tatizo likiendelea, wasiliana na msimamizi wa mfumo wako.</p>
    <div class="flex flex-wrap gap-3 justify-center">
      <a href="/" class="sp-btn sp-btn-primary">Rudi Kwenye Mfumo</a>
      <a href="javascript:location.reload()" class="sp-btn sp-btn-ghost">Jaribu Tena</a>
    </div>
  </div>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
